<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--navy-700);display:flex;align-items:center;justify-content:center}
.main img{width:640px;height:auto;display:block}
.strip{width:320px;display:flex;flex-direction:column}
.strip span{flex:1;display:block}
</style></head><body>
<div class="tile">
  <div class="main"><img src="assets/logos/logo-horizontal-2c.svg" alt="Gotham Knights Rugby"></div>
  <div class="strip">
    <span style="background:var(--gold-500)"></span>
    <span style="background:var(--pride-orange)"></span>
    <span style="background:var(--pride-red)"></span>
    <span style="background:var(--pride-violet)"></span>
  </div>
</div>
</body></html>
